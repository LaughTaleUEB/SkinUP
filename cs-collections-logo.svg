<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFAFCC" />
      <stop offset="50%" stop-color="#CDB4DB" />
      <stop offset="100%" stop-color="#A2D2FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#CDB4DB" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g transform="translate(100, 100)">
    <!-- Outer Diamond Frame -->
    <path d="M 0 -85 L 85 0 L 0 85 L -85 0 Z" fill="none" stroke="#FFFFFF" stroke-width="4" filter="url(#glow)"/>
    <path d="M 0 -78 L 78 0 L 0 78 L -78 0 Z" fill="url(#diamondGrad)" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>

    <!-- Tech Ring Arcs -->
    <circle cx="0" cy="0" r="55" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="3" stroke-dasharray="25 15 45 10"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2" stroke-dasharray="15 20 30 15"/>
    <circle cx="0" cy="0" r="68" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

    <!-- CS Text -->
    <text x="0" y="16" font-family="'Outfit', 'Arial Black', sans-serif" font-size="52" font-weight="900" font-style="italic" text-anchor="middle" fill="#FFFFFF" letter-spacing="-2" style="filter: drop-shadow(0px 3px 6px rgba(0,0,0,0.3));">CS</text>
  </g>
</svg>
