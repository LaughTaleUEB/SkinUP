<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Referans 3 Original Pastel Color Palette -->
    <linearGradient id="purpleGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5A3E5" />
      <stop offset="100%" stop-color="#B690DD" />
    </linearGradient>
    <linearGradient id="pinkGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FA9CBD" />
      <stop offset="100%" stop-color="#F68BB3" />
    </linearGradient>
    <linearGradient id="blueGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8BBDFC" />
      <stop offset="100%" stop-color="#70A8FA" />
    </linearGradient>

    <clipPath id="circleClipIcon">
      <circle cx="50" cy="50" r="48" />
    </clipPath>
  </defs>

  <g transform="translate(0, 0)">
    <g clip-path="url(#circleClipIcon)">
      <!-- Top-Left Sector (Purple) -->
      <path d="M 50 50 L 50 -10 L -10 -10 L -10 110 L 50 110 Z" fill="url(#purpleGradIcon)" />
      <!-- Top-Right Sector (Pink) -->
      <path d="M 50 50 L 50 -10 L 110 -10 L 110 60 Z" fill="url(#pinkGradIcon)" />
      <!-- Bottom Sector (Blue) -->
      <path d="M 50 50 L 110 60 L 110 110 L -10 110 Z" fill="url(#blueGradIcon)" />

      <!-- Referans 3 Original Emblem Cutout Arrow -->
      <path d="M 13 72 C 18 52, 28 38, 33 32 L 73 25 L 59 53 L 47 44 C 39 62, 31 79, 26 93 A 48 48 0 0 1 13 72 Z" fill="#FFFFFF" />
    </g>
  </g>
</svg>
